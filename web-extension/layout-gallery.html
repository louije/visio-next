<!doctype html>
<!--
  The layout engine in a real browser: one mocked Visio screen share per case
  (layout-case.html), as a grid of thumbnails. Open it to eyeball the layouts;
  layout-browser.test.cjs loads it in headless Chromium and checks what each case
  reports into <pre id="results">. Keep the window big enough to show every
  thumbnail: browsers don't run offscreen frames, so those cases report only once
  scrolled into view.
-->
<html>
<head>
<meta charset="utf-8">
<title>Layout gallery</title>
<style>
  body { margin: 8px; background: #222; color: #ddd; font: 11px system-ui; }
  #cases { display: grid; grid-template-columns: repeat(auto-fill, 216px); gap: 12px 8px; }
  figure { margin: 0; }
  .frame { width: 216px; overflow: hidden; }
  iframe { display: block; border: 0; transform-origin: 0 0; }
  figcaption { margin-top: 2px; }
  figcaption.bad { color: #f88; }
  #results { display: none; }
</style>
</head>
<body>
<div id="cases"></div>
<pre id="results"></pre>
<script>
  // Focus areas (the layout's content box): the reported screenshot, a laptop with
  // the chat panel open, a narrow window, a big screen. Shared screens: phone, a
  // tall Notion window, 4:3, 16:9, the screenshot's wide tab, a 32:9 ultrawide.
  var AREAS = [[1411, 893], [1280, 620], [900, 800], [1880, 960]];
  var RATIOS = [[9 / 16, '9:16'], [0.6, 'Notion 0.6:1'], [4 / 3, '4:3'], [16 / 9, '16:9'], [2.58, '2.58:1'], [32 / 9, '32:9']];
  var COUNTS = [2, 4, 7, 12, 20, 50];
  var WITH_SCROLLBARS = 50;   // also shown with always-visible scrollbars (a mouse, Windows)
  var PAD = 8;   // LiveKit pads the focus layout by --lk-grid-gap
  var THUMB = 216;

  var cases = document.getElementById('cases');
  var captions = {};
  AREAS.forEach(function (area) {
    RATIOS.forEach(function (ratio) {
      var runs = COUNTS.map(function (n) { return { n: n }; }).concat({ n: WITH_SCROLLBARS, bars: 1 });
      runs.forEach(function (run) {
        var n = run.n;
        var id = area[0] + 'x' + area[1] + ', ' + ratio[1] + ', ' + n + ' people' + (run.bars ? ', scrollbars' : '');
        var w = area[0] + 2 * PAD, h = area[1] + 2 * PAD, scale = THUMB / w;
        var figure = document.createElement('figure');
        var frame = document.createElement('div');
        frame.className = 'frame';
        frame.style.height = Math.ceil(h * scale) + 'px';
        var iframe = document.createElement('iframe');
        iframe.width = w;
        iframe.height = h;
        iframe.style.transform = 'scale(' + scale + ')';
        var query = { id: id, ar: ratio[0], n: n };
        if (run.bars) query.bars = 1;
        iframe.src = 'layout-case.html?' + new URLSearchParams(query);
        var caption = document.createElement('figcaption');
        caption.textContent = id + ' …';
        frame.appendChild(iframe);
        figure.appendChild(frame);
        figure.appendChild(caption);
        cases.appendChild(figure);
        captions[id] = caption;
      });
    });
  });

  var results = [];
  var out = document.getElementById('results');
  out.dataset.expected = Object.keys(captions).length;
  addEventListener('message', function (e) {
    var r = e.data;
    var caption = captions[r && r.id];
    if (!caption) return;
    results.push(r);
    caption.textContent = r.id + (r.problems.length ? ' ✗ ' + r.problems.join('; ') : ' ✓ ' + r.place + ' ×' + r.lines);
    caption.className = r.problems.length ? 'bad' : '';
    out.textContent = JSON.stringify(results);
  });
</script>
</body>
</html>
